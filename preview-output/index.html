<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AH-64 阿帕奇 武装直升机</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d12; }
  #scene { position: fixed; inset: 0; display: block; }
  #hud {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    font: 12px/1.6 "SF Mono", Menlo, Consolas, monospace;
    color: #9fe8c0; pointer-events: none; user-select: none;
    text-shadow: 0 0 8px rgba(0,0,0,.8);
  }
  #hud h1 { font-size: 14px; letter-spacing: 2px; color: #d7ffec; margin-bottom: 4px; }
  #hud .k { color: #ffd479; }
  #hud .dim { color: #5c7a6c; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <h1>AH-64 APACHE // 武装直升机</h1>
  <div><span class="k">拖动</span> 旋转 &nbsp; <span class="k">滚轮</span> 缩放 &nbsp; <span class="k">右键</span> 平移</div>
  <div><span class="k">R</span> 主旋翼转速 <span class="k">T</span> 尾桨转速 <span class="k">G</span> 机炮旋转 <span class="k">空格</span> 悬停动画</div>
  <div class="dim" id="stat"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9fb4c7, 0.0016);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(9, 4, 12);

// ---------- 灯光 ----------
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x5a4a3a, 1.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d8, 2.4);
sun.position.set(18, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -25;
sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;
sun.shadow.camera.bottom = -25;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x8fb7ff, 0.8);
rim.position.set(-10, 6, -12);
scene.add(rim);

// ---------- 地面 ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x4c5a44, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 简易跑道标线
const strip = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 80),
  new THREE.MeshStandardMaterial({ color: 0x2c3230, roughness: 0.9 })
);
strip.rotation.x = -Math.PI / 2;
strip.position.y = 0.01;
strip.receiveShadow = true;
scene.add(strip);

// ---------- 材质 ----------
const mat = {
  hull: new THREE.MeshStandardMaterial({ color: 0x4a4f3a, roughness: 0.55, metalness: 0.35 }),
  hullDark: new THREE.MeshStandardMaterial({ color: 0x33372a, roughness: 0.6, metalness: 0.3 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x22261f, roughness: 0.4, metalness: 0.7 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x6a6f63, roughness: 0.35, metalness: 0.85 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x1a2b33, roughness: 0.08, metalness: 0.6, transparent: true, opacity: 0.85 }),
  blade: new THREE.MeshStandardMaterial({ color: 0x1d211b, roughness: 0.5, metalness: 0.5 }),
  rotorHub: new THREE.MeshStandardMaterial({ color: 0x2a2d24, roughness: 0.4, metalness: 0.7 }),
  exhaust: new THREE.MeshStandardMaterial({ color: 0x15130f, roughness: 0.9, metalness: 0.2 }),
  missile: new THREE.MeshStandardMaterial({ color: 0x2c312a, roughness: 0.45, metalness: 0.6 }),
  rocket: new THREE.MeshStandardMaterial({ color: 0x3a3d2f, roughness: 0.5, metalness: 0.5 }),
  tip: new THREE.MeshStandardMaterial({ color: 0x9aa38f, roughness: 0.3, metalness: 0.8 }),
};

// ---------- 直升机主体 ----------
const heli = new THREE.Group();

function box(w, h, d, m, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function cyl(rt, rb, h, seg, m, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function sph(r, m, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// —— 机身（中段 + 机头锥）——
const fuselage = new THREE.Group();
const mid = box(1.15, 1.35, 3.4, mat.hull, 0, 0, 0);
mid.scale.y = 1.0;
fuselage.add(mid);

const nose = box(0.95, 0.95, 1.6, mat.hull, 0, 0.08, 2.5);
nose.rotation.x = -0.05;
fuselage.add(nose);

// 机头传感器吊舱
const tads = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.9, 16), mat.hullDark);
tads.rotation.x = Math.PI / 2;
tads.position.set(0, -0.05, 3.45);
fuselage.add(tads);

// 座舱盖（前后串列）
const canopyFront = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), mat.glass);
canopyFront.position.set(0, 0.45, 1.55);
canopyFront.scale.set(0.85, 0.7, 1.4);
canopyFront.castShadow = true;
fuselage.add(canopyFront);

const canopyRear = new THREE.Mesh(new THREE.SphereGeometry(0.58, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), mat.glass);
canopyRear.position.set(0, 0.55, 0.5);
canopyRear.scale.set(0.8, 0.7, 1.3);
canopyRear.castShadow = true;
fuselage.add(canopyRear);

// 驾驶舱分隔框
const frame = box(0.95, 0.1, 0.06, mat.metal, 0, 0.78, 1.05);
fuselage.add(frame);

heli.add(fuselage);

// —— 尾梁 ——
const tail = new THREE.Group();
const tailBoom = box(0.55, 0.55, 3.2, mat.hull, 0, 0.12, -3.3);
tailBoom.scale.z = 1;
tail.add(tailBoom);

// 尾翼水平安定面
const stab = box(1.7, 0.06, 0.7, mat.hull, 0, 0.35, -5.3);
tail.add(stab);
// 垂直安定面
const fin = box(0.06, 0.9, 0.8, mat.hull, 0.32, 0.45, -5.1);
fin.rotation.z = 0.12;
tail.add(fin);

// 尾旋翼组
const tailRotorGroup = new THREE.Group();
tailRotorGroup.position.set(0.34, 0.55, -5.45);
const tailRotor = new THREE.Group();
for (let i = 0; i < 4; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, 0.55), mat.blade);
  b.position.z = 0.55;
  b.rotation.y = (i * Math.PI) / 2;
  tailRotor.add(b);
}
const tailHub = sph(0.09, mat.rotorHub);
tailRotor.add(tailHub);
tailRotorGroup.add(tailRotor);
tail.add(tailRotorGroup);

heli.add(tail);

// —— 主旋翼 ——
const mainRotorGroup = new THREE.Group();
mainRotorGroup.position.set(0, 1.35, -0.2);
const rotor = new THREE.Group();
const bladeCount = 4;
for (let i = 0; i < bladeCount; i++) {
  const blade = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.05, 0.28), mat.blade);
  blade.rotation.y = (i * Math.PI * 2) / bladeCount;
  blade.castShadow = true;
  rotor.add(blade);
}
const hub = sph(0.22, mat.rotorHub);
hub.scale.y = 0.8;
rotor.add(hub);
const mast = cyl(0.12, 0.14, 0.6, 16, mat.rotorHub, 0, 0.15, 0);
mast.rotation.x = 0;
mainRotorGroup.add(rotor);
mainRotorGroup.add(mast);
heli.add(mainRotorGroup);

// —— 发动机舱（两侧）——
const engineL = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 2.6, 12), mat.hullDark);
engineL.rotation.z = Math.PI / 2;
engineL.position.set(0.72, 0.25, -0.4);
heli.add(engineL);
const engineR = engineL.clone();
engineR.position.x = -0.72;
heli.add(engineR);

// 排气管
const exhL = cyl(0.1, 0.12, 0.4, 10, mat.exhaust, 0.72, 0.25, -1.9);
exhL.rotation.x = Math.PI / 2;
heli.add(exhL);
const exhR = exhL.clone();
exhR.position.x = -0.72;
heli.add(exhR);

// —— 短翼 + 武器挂架 ——
const wingL = box(1.3, 0.08, 0.5, mat.hull, 1.15, -0.1, 0.2);
wingL.rotation.z = 0.03;
heli.add(wingL);
const wingR = wingL.clone();
wingR.position.x = -1.15;
wingR.rotation.z = -0.03;
heli.add(wingR);

// 火箭巢
function rocketPod(x, y, z) {
  const pod = new THREE.Group();
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.0, 12), mat.rocket);
  tube.rotation.x = Math.PI / 2;
  pod.add(tube);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.06, 12), mat.metal);
  face.rotation.x = Math.PI / 2;
  face.position.z = 0.52;
  pod.add(face);
  pod.position.set(x, y, z);
  heli.add(pod);
}
rocketPod(1.6, -0.35, 0.2);
rocketPod(-1.6, -0.35, 0.2);

// 反坦克导弹
function hellfire(x, y, z) {
  const m = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.9, 12), mat.missile);
  body.rotation.x = Math.PI / 2;
  m.add(body);
  const noseCone = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.15, 12), mat.tip);
  noseCone.rotation.x = Math.PI / 2;
  noseCone.position.z = 0.52;
  m.add(noseCone);
  m.position.set(x, y, z);
  heli.add(m);
}
hellfire(0.9, -0.28, 0.2);
hellfire(-0.9, -0.28, 0.2);

// —— 机鼻机炮 ——
const gunGroup = new THREE.Group();
gunGroup.position.set(0, -0.35, 3.3);
const gunBarrel = cyl(0.05, 0.06, 1.1, 10, mat.steel, 0, 0, -0.5);
gunBarrel.rotation.x = Math.PI / 2;
gunGroup.add(gunBarrel);
const gunMount = sph(0.15, mat.metal, 0, 0.05, 0);
gunGroup.add(gunMount);
heli.add(gunGroup);

// —— 起落架滑橇 ——
const skidL = box(0.1, 0.1, 2.2, mat.metal, 0.55, -0.95, -0.2);
heli.add(skidL);
const skidR = skidL.clone();
skidR.position.x = -0.55;
heli.add(skidR);
const strutFL = box(0.08, 0.6, 0.08, mat.metal, 0.55, -0.55, 0.8);
heli.add(strutFL);
const strutFR = strutFL.clone();
strutFR.position.x = -0.55;
heli.add(strutFR);
const strutRL = box(0.08, 0.6, 0.08, mat.metal, 0.55, -0.55, -1.1);
heli.add(strutRL);
const strutRR = strutRL.clone();
strutRR.position.x = -0.55;
heli.add(strutRR);

heli.position.y = 1.0;
scene.add(heli);

// ---------- 控制 ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minDistance = 4;
controls.maxDistance = 40;
controls.update();

const state = { rotor: 1, tail: 1, gun: 0, hover: false, rpm: 14, tailRpm: 40, gunTarget: 0 };

const stat = document.getElementById('stat');
window.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyR': state.rpm = state.rpm === 14 ? 5 : 14; break;
    case 'KeyT': state.tailRpm = state.tailRpm === 40 ? 12 : 40; break;
    case 'KeyG': state.gunTarget = state.gunTarget === 0 ? -0.5 : 0; break;
    case 'Space': e.preventDefault(); state.hover = !state.hover; break;
  }
});

// ---------- 动画 ----------
const clock = new THREE.Clock();
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;

  rotor.rotation.y += dt * state.rpm;
  tailRotor.rotation.x += dt * state.tailRpm;

  gunGroup.rotation.x += (state.gunTarget - gunGroup.rotation.x) * 0.08;

  if (state.hover) {
    heli.position.y = 1.0 + Math.sin(t * 2.2) * 0.08;
    heli.rotation.z = Math.sin(t * 1.3) * 0.03;
    heli.rotation.x = Math.sin(t * 1.7) * 0.02;
  } else {
    heli.position.y += (1.0 - heli.position.y) * 0.05;
    heli.rotation.z *= 0.95;
    heli.rotation.x *= 0.95;
  }

  controls.update();
  stat.textContent = `主旋翼 ${state.rpm.toFixed(1)} rad/s · 尾桨 ${state.tailRpm.toFixed(0)} rad/s · 机炮 ${Math.abs(heli.getWorldPosition) ? '' : ''}`;
  stat.textContent = `主旋翼 ${state.rpm.toFixed(1)} · 尾桨 ${state.tailRpm.toFixed(0)} · 悬停 ${state.hover ? 'ON' : 'OFF'}`;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
